<!DOCTYPE html>
<html dir="rtl" lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mah-Iran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Css/bootstrap.rtl.css">
    <link rel="stylesheet" href="Css/all.min.css">
    <link rel="stylesheet" href="Css/style.css">

</head>

<body class="bg-body-secondary">

    <header class="fixed-top bg-body-secondary w-100">

        <!-- Navbar -------------------------------------------- -->

        <section class="container-fluid">
            <div class="row">

                <!-- Hamburger -->
                <div class="col-4 d-flex ps-4 d-md-none">
                    <button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#mobilemenu">
                        <i class="fa-solid fa-bars fs-3"></i>
                    </button>
                    <div class="offcanvas offcanvas-start" id="mobilemenu">
                        <ul class="list-unstyled d-flex gap-3 pt-3 flex-column m-3 fs-3">
                            <li>
                                <a class="text-decoration-none text-black" href="">زنانه</a>
                            </li>
                            <li>
                                <a class="text-decoration-none text-black" href="">مردانه</a>
                            </li>
                            <li>
                                <a class="text-decoration-none text-black" href="">بچگانه</a>
                            </li>
                            <li>
                                <a class="text-decoration-none text-black" href="">اکسسوری</a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Left Menu -->
                <div class="col-md-3 d-none d-md-flex justify-content-center">
                    <ul class="list-unstyled d-flex gap-3 pt-3">
                        <li>
                            <a class="text-decoration-none text-black" href="">زنانه</a>
                        </li>
                        <li>
                            <a class="text-decoration-none text-black" href="">مردانه</a>
                        </li>

                    </ul>
                </div>

                <!-- Logo -->
                <div class="col-4 col-md-3 d-flex flex-row gap-1 pt-2 justify-content-center">
                    <i class="fa-solid fa-moon"></i>
                    <h2>ماه ایران</h2>
                </div>

                <!-- Right Menu -->
                <div class="col-md-3 d-none d-md-flex justify-content-center">
                    <ul class="list-unstyled d-flex gap-3 pt-3">
                        <li>
                            <a class="text-decoration-none text-black" href="">بچگانه</a>
                        </li>
                        <li>
                            <a class="text-decoration-none text-black" href="">اکسسوری</a>
                        </li>
                    </ul>
                </div>

                <!-- Search & Cart -->
                <div class="col-4 col-md-3 d-flex gap-2 justify-content-center align-items-center">

                    <div class="dropdown">
                        <button class="btn border-0 dropdown-toggle" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>

                        <div class="dropdown-menu bg-transparent border-0">
                            <form action="">
                                <input class="p-1" type="search" placeholder="جستجو">
                            </form>
                        </div>
                    </div>

                    <i class="btn p-1 fa-solid fa-bag-shopping"></i>

                </div>

            </div>
        </section>

    </header>



    <main>
        <!-- Hero ---------------------------------------------- -->
        <section class="container-fluid hero border-bottom border-dark-subtle border-1">
            <div
                class="ms-4 hero-title d-flex h-100 align-items-center justify-content-center justify-content-md-start ">
                <div class="div-title-box d-flex flex-column ms-lg-5 ">
                    <h1 class="text-start hero-title-h1 "> استایل خودت رو<br><span
                            class="text-bg-warning text-black rounded-2 p-1"> پیدا کن</span></h1>
                    <p>به کالکشن جدید ماه ایران سر بزنید</p>
                    <div>
                        <button class="btn btn-outline-secondary text-dark">خرید جدید ترین ها</button>
                        <button class="btn btn-warning text-dark">مشاهده کالکشن</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Categories ---------------------------------------- -->

        <section>
            <div class="container-fluid">
                <div class="d-flex align-items-center m-2 gap-2">
                    <h4>دسته بندی ها</h4>
                    <i class="fa-solid fa-arrow-left pb-1"></i>
                </div>
                <div>
                    <div class="d-flex gap-2 overflow-x-auto flex-column flex-md-row category">
                        <div class="card flex-shrink-0 category-card">
                            <img src="images/category-shoes.jpg" class="card-img img-fluid" alt="">
                            <div class="card-img-overlay d-flex justify-content-center">
                                <button class="btn btn-warning text-dark mt-auto">کفش ها</button>
                            </div>
                        </div>
                        <div class="card flex-shrink-0 category-card">
                            <img src="images/category-accessorie.jpg" class="card-img img-fluid" alt="">
                            <div class="card-img-overlay d-flex justify-content-center">
                                <button class="btn btn-warning text-dark mt-auto">اکسسوری</button>
                            </div>
                        </div>
                        <div class="card flex-shrink-0 category-card">
                            <img src="images/category-men.jpg" class="card-img img-fluid" alt="">
                            <div class="card-img-overlay d-flex justify-content-center">
                                <button class="btn btn-warning text-dark mt-auto">مردانه</button>
                            </div>
                        </div>
                        <div class="card flex-shrink-0 category-card">
                            <img src="images/category-women.jpg" class="card-img img-fluid" alt="">
                            <div class="card-img-overlay d-flex justify-content-center">
                                <button class="btn btn-warning text-dark mt-auto">زنانه</button>
                            </div>
                        </div>
                    </div>
                </div>    
            </div>
        </section>

        <!-- New Arrivals -------------------------------------- -->
        <section class="new-arrivals bg-light-subtle border-top border-dark-subtle mt-5">

            <div class="container-fluid">
                <div class="d-flex align-items-center m-2 gap-2" >
                    <h4>جدید ترین ها</h4>
                    <i class="fa-solid fa-arrow-left pb-1"></i>
                </div>
                <div class="d-flex flex-column flex-md-row gap-2">
                    <div class="card d-flex" style="background: #EFECE7;">
                        <img src="images/classic-trousers.jpg" class="card-img-top img-fluid" alt="">
                        <div class="d-flex flex-column card-body">
                            <a class="btn btn-primary text-start">شلوار پارچه ای کلاسیک</a>
                            <p class="card-text mt-3 ms-2">1,490,000</p>
                        </div>
                    </div>
                    <div class="card d-flex" style="background: #EFECE7;">
                        <img src="images/Blue-Bag.jpg" class="card-img-top img-fluid" alt="">
                        <div class="d-flex flex-column card-body">
                            <a href="#" class=" btn btn-primary text-start">کیف دوشی ابی</a>
                            <p class="card-text mt-3 ms-2">699,000</p>
                        </div>
                    </div>
                    <div class="card d-flex" style="background: #EFECE7;">
                        <img src="images/aria-linen-blazer.jpg" class="card-img-top img-fluid" alt="">
                        <div class="d-flex flex-column card-body">
                            <a href="#" class=" btn btn-primary text-start">کت لینن اریا</a>
                            <p class="card-text mt-3 ms-2">1,599,000</p>
                        </div>
                    </div>
                    <div class="card d-flex" style="background: #EFECE7;">
                        <img src="images/aseman-shoes.jpg" class="card-img-top img-fluid" alt="">
                        <div class="d-flex flex-column card-body">
                            <a class="btn btn-primary text-start">کفش کتانی اسمان</a>
                            <p class="card-text mt-3 ms-2">999,000</p>
                        </div>
                    </div>
                </div>
            </div>

        </section>

       
        <!-- Promotional Banner -------------------------------- -->


        <!-- Brand Story --------------------------------------- -->


        <!-- Newsletter ---------------------------------------- -->
    </main>





    <footer>
        <!-- ooter -->


    </footer>




    <script src="Js/bootstrap.bundle.min.js"></script>
</body>

</html>
